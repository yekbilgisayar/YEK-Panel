plugins {
    id "com.android.application"
}

android {
    namespace "com.yekbilgisayar.yekpanel"
    compileSdk 35

    defaultConfig {
        applicationId "com.yekbilgisayar.yekpanel"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
        resourceConfigurations += ["tr", "en"]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Play Store yayını için kendi yükleme anahtarınızla imzalayın.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        // Arayüz metinleri bilinçli olarak yalnızca Türkçe tutuluyor.
        disable "SetTextI18n"
    }
}
