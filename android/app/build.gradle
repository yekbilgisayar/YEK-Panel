plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesPath = System.getenv("YEK_KEYSTORE_PROPERTIES")
def keystorePropertiesFile = keystorePropertiesPath ? file(keystorePropertiesPath) : null
if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.yekbilgisayar.yekpanel"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.yekbilgisayar.yekpanel"
        minSdk = 26
        targetSdk = 37
        versionCode = 4
        versionName = "1.2.1"
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        localeFilters += ["tr", "en"]
    }

    signingConfigs {
        upload {
            if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        sideload {
            dimension = "distribution"
            buildConfigField "boolean", "PLAY_BUILD", "false"
            // GitHub sideload APK'sı mevcut 1.2.x kurulumlarıyla aynı test anahtarını
            // kullanmaya devam eder.
            signingConfig = signingConfigs.debug
        }
        play {
            dimension = "distribution"
            buildConfigField "boolean", "PLAY_BUILD", "true"
            // Play AAB'si yükleme anahtarıyla imzalanır. Build type signingConfig
            // flavor ayarını ezip debug anahtarına düşürdüğü için imza burada verilir.
            if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.upload
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        // Arayüz metinleri bilinçli olarak yalnızca Türkçe tutuluyor.
        disable "SetTextI18n"
    }
}
